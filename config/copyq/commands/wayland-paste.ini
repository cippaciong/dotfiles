; CopyQ script command: paste via ydotool.
;
; On Wayland, CopyQ cannot send keystrokes to other windows by itself, so
; pasting from the item list does not work. The approach recommended in the
; CopyQ docs is to override paste() with an external tool. This one uses
; ydotool, which injects through /dev/uinput and works on any compositor.
; Requires the ydotool package and its user service:
;   systemctl --user enable --now ydotool
;
; Import into a running CopyQ (idempotent, skips if already present):
;   copyq eval 'var t=input(),c=commands(); if(!c.some(function(x){return x.name=="Paste with ydotool"})) setCommands(c.concat(importCommands(t)))' < ~/.dotfiles/config/copyq/commands/wayland-paste.ini
;
; Key codes are Linux evdev codes: 42 = LeftShift, 110 = Insert.
[Command]
Command="
    copyq:
    global.paste = function() {
        sleep(250)
        execute('ydotool', 'key', '42:1', '110:1', '110:0', '42:0')
    }"
Icon=
IsScript=true
Name=Paste with ydotool
